services:
  server:
    build: .
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgres://pkpass:pkpass@db:5432/pkpass?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pkpass
      POSTGRES_PASSWORD: pkpass
      POSTGRES_DB: pkpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkpass"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
